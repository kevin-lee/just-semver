name: Build All

on:
  push:

  pull_request:
    branches:
      - main

env:
  GH_JVM_OPTS: "-Xss64m -Xms1024m -XX:MaxMetaspaceSize=1G -Xmx2G -XX:MaxInlineLevel=18 -XX:+UnlockExperimentalVMOptions"

jobs:

  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        scala:
          - { name: "Scala 2",   version: "2.12.21", binary-version: "2.12", java-version: "11", java-distribution: "temurin", params: "" }
          - { name: "Scala 2",   version: "2.13.17", binary-version: "2.13", java-version: "11", java-distribution: "temurin", params: "" }
          - { name: "Scala 3.1", version: "3.3.5",   binary-version: "3",    java-version: "11", java-distribution: "temurin", params: '' }

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.scala.java-version }}
          distribution: ${{ matrix.scala.java-distribution }}
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1

      - name: "[Push] Build All for Scala ${{ matrix.scala.version }}"
        if: github.event_name == 'push'
        env:
          CURRENT_BRANCH_NAME: ${{ github.ref }}
          SBT_OPTS: ${{ env.GH_JVM_OPTS }}
        run: |
          echo "[BEFORE]CURRENT_BRANCH_NAME=${CURRENT_BRANCH_NAME}"
          export CURRENT_BRANCH_NAME="${CURRENT_BRANCH_NAME#refs/heads/}"
          echo " [AFTER]CURRENT_BRANCH_NAME=${CURRENT_BRANCH_NAME}"
          java -version
          .github/workflows/sbt-build-all.sh ${{ matrix.scala.version }} "${{ matrix.scala.params }}"

      - name: "[PR] Build All for Scala ${{ matrix.scala.version }}"
        if: github.event_name == 'pull_request'
        env:
          CURRENT_BRANCH_NAME: ${{ github.base_ref }}
          SBT_OPTS: ${{ env.GH_JVM_OPTS }}
        run: |
          echo "Rull request to the '${CURRENT_BRANCH_NAME}' branch"
          java -version
          .github/workflows/sbt-build-all.sh ${{ matrix.scala.version }} "${{ matrix.scala.params }}"
